<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <title>찬 공기가 낮은 지형에 모여 예보 최저기온보다 더 차가워진다는 도해</title>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#20342A">
    <text x="16" y="24" font-size="13" font-weight="700">찬 공기는 낮은 곳에 모입니다</text>

    <!-- 지형 -->
    <path d="M20 78c46 0 62 42 102 62 34 17 60 -6 96 -22 40 -18 66 12 162 12v50H20z"
          fill="#E8DCC8" stroke="#B99A72" stroke-width="1.6"/>

    <!-- 찬 공기층 -->
    <path d="M92 140c30 18 56 22 84 12 26 -9 44 -22 72 -22 -6 22 -34 40 -80 40s-72 -14 -76 -30z"
          fill="#CFE0EA" opacity="0.9"/>
    <g stroke="#6E9FC4" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M62 92c8 18 18 30 30 40"/>
      <path d="M92 132l-8 -2 2 8"/>
      <path d="M330 100c-14 20 -34 34 -60 40"/>
      <path d="M270 140l8 -3 -1 8"/>
    </g>
    <text x="176" y="168" font-size="11" font-weight="700" fill="#2E6690" text-anchor="middle">찬 공기가 고이는 구역</text>

    <!-- 온도 라벨 -->
    <g transform="translate(330 62)">
      <rect x="-46" y="-15" width="92" height="26" rx="13" fill="#FFFFFF" stroke="#9FBFAE" stroke-width="1.2"/>
      <text x="0" y="3" font-size="11" text-anchor="middle">예보 최저기온</text>
    </g>
    <g transform="translate(176 196)">
      <rect x="-64" y="-14" width="128" height="24" rx="12" fill="#FDF0EC" stroke="#B4472E" stroke-width="1.2"/>
      <text x="0" y="3" font-size="11" font-weight="700" fill="#B4472E" text-anchor="middle">여기는 더 낮을 수 있음</text>
    </g>

    <text x="20" y="60" font-size="11" fill="#5F7166">맑고 바람 없는 밤</text>

    <text x="384" y="215" font-size="9" fill="#9FBFAE" text-anchor="end">관찰 지점 도해</text>
  </g>
</svg>
