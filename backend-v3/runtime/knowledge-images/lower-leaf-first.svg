<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <title>과습이 이어진 뒤에는 포기의 아랫잎부터 확인한다는 도해</title>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#20342A">
    <text x="16" y="24" font-size="13" font-weight="700">아랫잎부터 위로 올라가며 봅니다</text>

    <!-- 흙 -->
    <path d="M40 168h320" stroke="#B99A72" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 176h320" stroke="#D7C3A4" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 7"/>

    <!-- 포기 -->
    <g transform="translate(160 168)">
      <path d="M0 0v-116" stroke="#4E9A6B" stroke-width="3" stroke-linecap="round"/>
      <!-- 아랫잎 -->
      <g fill="#EAF5EE" stroke="#6FB88A" stroke-width="1.5">
        <path d="M-2 -20c-30 -4 -44 -14 -44 -20 6 -8 26 -8 44 4z"/>
        <path d="M2 -20c30 -4 44 -14 44 -20 -6 -8 -26 -8 -44 4z"/>
      </g>
      <circle cx="-26" cy="-30" r="5" fill="#C98A72" stroke="#B4472E" stroke-width="1.2"/>
      <circle cx="24" cy="-32" r="3.6" fill="#C98A72" stroke="#B4472E" stroke-width="1.2"/>
      <!-- 중간잎 -->
      <g fill="#CDE7D6" stroke="#6FB88A" stroke-width="1.5">
        <path d="M-2 -62c-27 -4 -39 -13 -39 -18 5 -7 23 -7 39 4z"/>
        <path d="M2 -62c27 -4 39 -13 39 -18 -5 -7 -23 -7 -39 4z"/>
      </g>
      <!-- 위잎 -->
      <g fill="#6FB88A" stroke="#4E9A6B" stroke-width="1.5">
        <path d="M-2 -100c-21 -3 -30 -10 -30 -14 4 -6 18 -6 30 3z"/>
        <path d="M2 -100c21 -3 30 -10 30 -14 -4 -6 -18 -6 -30 3z"/>
      </g>
    </g>

    <!-- 순서 -->
    <g stroke="#C8892B" stroke-width="2" stroke-linecap="round">
      <path d="M244 148v-96"/>
      <path d="M244 52l-5 8M244 52l5 8"/>
    </g>
    <g font-size="11" fill="#C8892B" font-weight="700">
      <text x="254" y="152">1. 아랫잎</text>
      <text x="254" y="106">2. 중간잎</text>
      <text x="254" y="60">3. 위잎</text>
    </g>
    <text x="64" y="60" font-size="11" fill="#5F7166">한쪽 구역에만</text>
    <text x="64" y="76" font-size="11" fill="#5F7166">몰렸는지 함께</text>
    <text x="64" y="92" font-size="11" fill="#5F7166">확인합니다</text>

    <text x="16" y="204" font-size="11" fill="#5F7166">넓어지는 속도와 위치가 다음 확인 시점을 정하는 근거가 됩니다.</text>
    <text x="384" y="215" font-size="9" fill="#9FBFAE" text-anchor="end">관찰 지점 도해</text>
  </g>
</svg>
