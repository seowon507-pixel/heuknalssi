<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <title>비가 그친 뒤 물이 남아 있는 낮은 구역과 막힌 배수로를 확인한다는 도해</title>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#20342A">
    <text x="16" y="24" font-size="13" font-weight="700">비가 그친 뒤에 확인합니다</text>

    <!-- 밭 단면 -->
    <path d="M20 96c40 0 54 14 84 14s44-26 84-26 54 34 84 34 68-10 88-10v70H20z"
          fill="#E8DCC8" stroke="#B99A72" stroke-width="1.6"/>
    <!-- 고인 물 -->
    <path d="M104 110c22 0 40 -2 56 -10 8 20 -6 30 -28 30s-36 -8 -28 -20z" fill="#6E9FC4" opacity="0.65"/>
    <ellipse cx="132" cy="112" rx="30" ry="6" fill="#6E9FC4"/>
    <path d="M262 118c18 6 34 8 48 8 4 14 -10 20 -26 20s-28 -12 -22 -28z" fill="#6E9FC4" opacity="0.45"/>

    <!-- 강조 -->
    <g stroke="#C8892B" stroke-width="1.8" fill="none">
      <ellipse cx="132" cy="116" rx="44" ry="22"/>
    </g>
    <text x="132" y="76" font-size="12" font-weight="700" fill="#C8892B" text-anchor="middle">물이 남는 자리</text>
    <path d="M132 82v10" stroke="#C8892B" stroke-width="1.6"/>

    <!-- 배수로 -->
    <g transform="translate(330 150)">
      <rect x="-24" y="-14" width="48" height="26" rx="4" fill="#CFE0EA" stroke="#6E9FC4" stroke-width="1.6"/>
      <g fill="#B99A72">
        <circle cx="-8" cy="0" r="5"/><circle cx="4" cy="3" r="4"/><circle cx="12" cy="-3" r="3.4"/>
      </g>
      <text x="0" y="30" font-size="11" font-weight="700" fill="#B4472E" text-anchor="middle">막힌 배수로</text>
    </g>

    <!-- 물 흐름 -->
    <g stroke="#6E9FC4" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M186 128h58"/>
      <path d="M238 123l7 5-7 5"/>
    </g>

    <text x="16" y="204" font-size="11" fill="#5F7166">같은 자리가 반복해 젖으면 그 구간의 물 흐름을 먼저 확보합니다.</text>
    <text x="384" y="215" font-size="9" fill="#9FBFAE" text-anchor="end">관찰 지점 도해</text>
  </g>
</svg>
