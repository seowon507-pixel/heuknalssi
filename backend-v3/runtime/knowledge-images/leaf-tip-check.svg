<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <title>잎 끝이 마르는 증상은 포기 바깥쪽 겉잎 끝부터 확인한다는 도해</title>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#20342A">
    <text x="16" y="24" font-size="13" font-weight="700">겉잎 끝부터 안쪽으로 봅니다</text>

    <!-- 포기 위에서 본 모습 -->
    <g transform="translate(150 122)">
      <!-- 겉잎 -->
      <g fill="#EAF5EE" stroke="#6FB88A" stroke-width="1.5">
        <ellipse cx="0" cy="-52" rx="24" ry="34"/>
        <ellipse cx="0" cy="-52" rx="24" ry="34" transform="rotate(60)"/>
        <ellipse cx="0" cy="-52" rx="24" ry="34" transform="rotate(120)"/>
        <ellipse cx="0" cy="-52" rx="24" ry="34" transform="rotate(180)"/>
        <ellipse cx="0" cy="-52" rx="24" ry="34" transform="rotate(240)"/>
        <ellipse cx="0" cy="-52" rx="24" ry="34" transform="rotate(300)"/>
      </g>
      <!-- 마른 잎 끝 -->
      <g fill="none" stroke="#B4472E" stroke-width="2.6" stroke-linecap="round">
        <path d="M-9 -82a12 12 0 0 1 18 0"/>
        <path d="M62 -38a12 12 0 0 1 9 15"/>
        <path d="M-71 -23a12 12 0 0 1 9 -15"/>
      </g>
      <!-- 중간잎 -->
      <g fill="#CDE7D6" stroke="#6FB88A" stroke-width="1.4">
        <ellipse cx="0" cy="-28" rx="15" ry="20"/>
        <ellipse cx="0" cy="-28" rx="15" ry="20" transform="rotate(90)"/>
        <ellipse cx="0" cy="-28" rx="15" ry="20" transform="rotate(180)"/>
        <ellipse cx="0" cy="-28" rx="15" ry="20" transform="rotate(270)"/>
      </g>
      <circle cx="0" cy="0" r="9" fill="#6FB88A" stroke="#4E9A6B" stroke-width="1.4"/>
    </g>

    <g font-size="11">
      <text x="252" y="66" fill="#B4472E" font-weight="700">1. 겉잎 끝</text>
      <text x="252" y="82" fill="#5F7166">가장 먼저 나타남</text>
      <text x="252" y="116" fill="#C8892B" font-weight="700">2. 중간잎</text>
      <text x="252" y="132" fill="#5F7166">번졌는지 확인</text>
      <text x="252" y="166" fill="#20342A" font-weight="700">3. 포기 중심</text>
      <text x="252" y="182" fill="#5F7166">무름·냄새 확인</text>
    </g>
    <g stroke="#9FBFAE" stroke-width="1.2" stroke-dasharray="3 4">
      <path d="M214 62h32M214 112h32M214 162h32"/>
    </g>

    <text x="384" y="215" font-size="9" fill="#9FBFAE" text-anchor="end">관찰 지점 도해</text>
  </g>
</svg>
