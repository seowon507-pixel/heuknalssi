<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <title>햇볕 데임은 직사광선을 받는 남서쪽 과실 면부터 확인한다는 도해</title>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#20342A">
    <text x="16" y="24" font-size="13" font-weight="700">직사광선을 받는 면부터 확인합니다</text>

    <!-- 해 -->
    <g transform="translate(66 74)">
      <circle cx="0" cy="0" r="17" fill="#E8B54A"/>
      <g stroke="#E8B54A" stroke-width="2.4" stroke-linecap="round">
        <path d="M0 -26v-9M0 26v9M-26 0h-9M26 0h9M-18 -18l-6 -6M18 18l6 6M18 -18l6 -6M-18 18l-6 6"/>
      </g>
      <text x="0" y="42" font-size="11" fill="#5F7166" text-anchor="middle">오후 햇빛</text>
    </g>

    <!-- 광선 -->
    <g stroke="#E8B54A" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M96 84l60 16M96 100l58 8M96 116l58 0"/>
    </g>

    <!-- 과실 -->
    <g transform="translate(216 108)">
      <path d="M0 -46c26 0 44 20 44 46s-18 46-44 46-44-20-44-46 18-46 44-46z" fill="#6FB88A" stroke="#4E9A6B" stroke-width="1.6"/>
      <!-- 광선을 받는 쪽 면 -->
      <path d="M0 -46c-26 0-44 20-44 46s18 46 44 46z" fill="#EFDCBB"/>
      <path d="M0 -46v92" stroke="#C8892B" stroke-width="1.6" stroke-dasharray="4 4"/>
      <path d="M-4 -54c-8 -6 -16 -6 -22 0" fill="none" stroke="#4E9A6B" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- 강조 라벨 -->
    <g>
      <path d="M170 158h44" stroke="#C8892B" stroke-width="1.6"/>
      <path d="M170 152v12M214 152v12" stroke="#C8892B" stroke-width="1.6"/>
      <text x="192" y="180" font-size="12" font-weight="700" fill="#C8892B" text-anchor="middle">이 면</text>
    </g>
    <text x="286" y="104" font-size="11" fill="#5F7166">그늘 면은</text>
    <text x="286" y="120" font-size="11" fill="#5F7166">나중에</text>

    <text x="16" y="204" font-size="11" fill="#5F7166">병 반점과 달리 해가 강하게 닿는 면에 몰리고 경계가 뚜렷합니다.</text>
    <text x="384" y="215" font-size="9" fill="#9FBFAE" text-anchor="end">관찰 지점 도해</text>
  </g>
</svg>
