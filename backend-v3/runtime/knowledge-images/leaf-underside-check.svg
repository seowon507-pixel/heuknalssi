<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <title>잎 뒷면을 뒤집어 확인해야 초기 변색과 작은 해충을 볼 수 있다는 도해</title>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#20342A">
    <text x="16" y="24" font-size="13" font-weight="700">잎을 뒤집어 뒷면을 봅니다</text>

    <!-- 앞면 -->
    <g transform="translate(96 112)">
      <path d="M0 -44c28 13 41 31 41 44s-13 31-41 44c-28-13-41-31-41-44s13-31 41-44z" fill="#6FB88A" stroke="#4E9A6B" stroke-width="1.6"/>
      <path d="M0 -44v88" stroke="#4E9A6B" stroke-width="1.4"/>
      <text x="0" y="66" font-size="12" font-weight="700" text-anchor="middle">앞면</text>
      <text x="0" y="82" font-size="11" fill="#5F7166" text-anchor="middle">이상 없어 보임</text>
    </g>

    <!-- 회전 화살표 -->
    <g transform="translate(196 106)">
      <path d="M-20 8a22 22 0 1 1 40 0" fill="none" stroke="#C8892B" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M20 8l-6-7 8-2z" fill="#C8892B"/>
      <text x="0" y="34" font-size="11" font-weight="700" fill="#C8892B" text-anchor="middle">뒤집기</text>
    </g>

    <!-- 뒷면 -->
    <g transform="translate(296 112)">
      <path d="M0 -44c28 13 41 31 41 44s-13 31-41 44c-28-13-41-31-41-44s13-31 41-44z" fill="#EAF5EE" stroke="#6FB88A" stroke-width="1.6"/>
      <path d="M0 -44v88" stroke="#9FBFAE" stroke-width="1.4"/>
      <g fill="#5F7166">
        <ellipse cx="-14" cy="-14" rx="3.4" ry="2.4"/>
        <ellipse cx="10" cy="-2" rx="3.4" ry="2.4"/>
        <ellipse cx="-8" cy="16" rx="3.4" ry="2.4"/>
      </g>
      <circle cx="16" cy="20" r="6" fill="#EFDCBB" stroke="#C8892B" stroke-width="1.2"/>
      <text x="0" y="66" font-size="12" font-weight="700" fill="#C8892B" text-anchor="middle">뒷면</text>
      <text x="0" y="82" font-size="11" fill="#5F7166" text-anchor="middle">먼저 보이는 곳</text>
    </g>

    <text x="16" y="204" font-size="11" fill="#5F7166">포기마다 아래·중간·위 잎을 하나씩 골라 며칠 간격으로 다시 봅니다.</text>
    <text x="384" y="215" font-size="9" fill="#9FBFAE" text-anchor="end">관찰 지점 도해</text>
  </g>
</svg>
