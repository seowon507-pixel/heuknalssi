<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <title>같은 잎을 같은 각도로 다시 찍어 반점이 번지는지 비교한다는 도해</title>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#20342A">
    <text x="16" y="24" font-size="13" font-weight="700">같은 잎을 같은 각도로 다시 봅니다</text>

    <!-- 어제 -->
    <g transform="translate(98 116)">
      <path d="M0 -48c30 14 44 34 44 48s-14 34-44 48c-30-14-44-34-44-48s14-34 44-48z" fill="#EAF5EE" stroke="#6FB88A" stroke-width="1.6"/>
      <path d="M0 -48v96" stroke="#6FB88A" stroke-width="1.4"/>
      <g stroke="#9FBFAE" stroke-width="1"><path d="M0 -24l20 10M0 -24l-20 10M0 4l22 10M0 4l-22 10"/></g>
      <circle cx="-13" cy="-12" r="4" fill="#C98A72" stroke="#B4472E" stroke-width="1.2"/>
      <text x="0" y="72" font-size="12" font-weight="700" text-anchor="middle">어제</text>
    </g>

    <!-- 오늘 -->
    <g transform="translate(276 116)">
      <path d="M0 -48c30 14 44 34 44 48s-14 34-44 48c-30-14-44-34-44-48s14-34 44-48z" fill="#EAF5EE" stroke="#6FB88A" stroke-width="1.6"/>
      <path d="M0 -48v96" stroke="#6FB88A" stroke-width="1.4"/>
      <g stroke="#9FBFAE" stroke-width="1"><path d="M0 -24l20 10M0 -24l-20 10M0 4l22 10M0 4l-22 10"/></g>
      <circle cx="-13" cy="-12" r="10" fill="#C98A72" stroke="#B4472E" stroke-width="1.4"/>
      <circle cx="9" cy="10" r="5" fill="#C98A72" stroke="#B4472E" stroke-width="1.2"/>
      <text x="0" y="72" font-size="12" font-weight="700" fill="#B4472E" text-anchor="middle">오늘</text>
    </g>

    <g transform="translate(187 112)">
      <path d="M-8 0h20" stroke="#C8892B" stroke-width="2" stroke-linecap="round"/>
      <path d="M6 -5l7 5-7 5" fill="none" stroke="#C8892B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="2" y="-14" font-size="11" fill="#C8892B" text-anchor="middle">넓어짐</text>
    </g>

    <text x="16" y="204" font-size="11" fill="#5F7166">번지는 속도는 사진 한 장으로 알 수 없습니다. 같은 자리를 날짜와 함께 남기세요.</text>
    <text x="384" y="215" font-size="9" fill="#9FBFAE" text-anchor="end">관찰 지점 도해</text>
  </g>
</svg>
