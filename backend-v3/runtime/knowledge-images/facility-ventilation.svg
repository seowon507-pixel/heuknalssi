<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <title>시설 하우스는 천창과 측창을 함께 열어 공기가 한 방향으로 흐르게 한다는 도해</title>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#20342A">
    <text x="16" y="24" font-size="13" font-weight="700">천창과 측창을 함께 엽니다</text>

    <!-- 하우스 단면 -->
    <path d="M52 168V116a148 60 0 0 1 296 0v52" fill="#F2F8F4" stroke="#9FBFAE" stroke-width="2"/>
    <path d="M44 168h312" stroke="#B99A72" stroke-width="4" stroke-linecap="round"/>

    <!-- 천창 -->
    <g transform="translate(200 68)">
      <path d="M-30 4h60" stroke="#F2F8F4" stroke-width="5"/>
      <path d="M-30 4l26 -22" stroke="#6E9FC4" stroke-width="3" stroke-linecap="round"/>
      <path d="M30 4l-26 -22" stroke="#6E9FC4" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="-28" font-size="11" font-weight="700" fill="#20342A" text-anchor="middle">천창</text>
    </g>

    <!-- 측창 -->
    <g stroke="#6E9FC4" stroke-width="3" stroke-linecap="round">
      <path d="M56 150l-16 -12"/>
      <path d="M344 150l16 -12"/>
    </g>
    <text x="34" y="176" font-size="11" font-weight="700" text-anchor="middle">측창</text>
    <text x="366" y="176" font-size="11" font-weight="700" text-anchor="middle">측창</text>

    <!-- 공기 흐름 -->
    <g fill="none" stroke="#6E9FC4" stroke-width="2.2" stroke-linecap="round">
      <path d="M64 142c40 4 62 -14 76 -34"/>
      <path d="M140 108l0 -9 8 5" />
      <path d="M336 142c-40 4 -62 -14 -76 -34"/>
      <path d="M260 108l0 -9 -8 5"/>
      <path d="M200 96v-18"/>
      <path d="M200 78l-5 8M200 78l5 8"/>
    </g>

    <!-- 젖은 잎 -->
    <g transform="translate(200 148)">
      <path d="M-14 0c0 -10 6 -16 14 -16s14 6 14 16z" fill="#6FB88A" stroke="#4E9A6B" stroke-width="1.4"/>
      <g fill="#6E9FC4"><circle cx="-6" cy="-10" r="2.2"/><circle cx="4" cy="-13" r="2.2"/></g>
    </g>
    <text x="200" y="196" font-size="11" fill="#5F7166" text-anchor="middle">잎이 젖어 있는 시간을 줄이는 것이 목적입니다</text>

    <text x="384" y="215" font-size="9" fill="#9FBFAE" text-anchor="end">관찰 지점 도해</text>
  </g>
</svg>
