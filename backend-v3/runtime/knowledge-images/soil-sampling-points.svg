<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <title>토양검정 시료는 밭 여러 지점에서 채취해 한 봉지로 섞어 제출한다는 도해</title>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#20342A">
    <text x="16" y="24" font-size="13" font-weight="700">여러 지점에서 채취해 섞습니다</text>

    <!-- 밭 (위에서 본 모습) -->
    <rect x="20" y="44" width="212" height="126" rx="6" fill="#EFE6D6" stroke="#B99A72" stroke-width="1.6"/>
    <g stroke="#DDCFB8" stroke-width="1"><path d="M20 86h212M20 128h212M91 44v126M161 44v126"/></g>

    <!-- 채취 지점 (지그재그) -->
    <g>
      <polyline points="52,68 122,110 56,146 160,66 196,112 130,152"
                fill="none" stroke="#C8892B" stroke-width="1.4" stroke-dasharray="4 4"/>
      <g fill="#C8892B">
        <circle cx="52" cy="68" r="6"/><circle cx="122" cy="110" r="6"/><circle cx="56" cy="146" r="6"/>
        <circle cx="160" cy="66" r="6"/><circle cx="196" cy="112" r="6"/><circle cx="130" cy="152" r="6"/>
      </g>
    </g>
    <text x="126" y="188" font-size="11" fill="#5F7166" text-anchor="middle">한 지점만 파지 않고 밭 전체에서 골고루</text>

    <!-- 화살표 -->
    <g stroke="#5F7166" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M244 106h30"/>
      <path d="M268 101l7 5-7 5"/>
    </g>

    <!-- 봉지 -->
    <g transform="translate(330 104)">
      <path d="M-26 -30h52v56a8 8 0 0 1 -8 8h-36a8 8 0 0 1 -8 -8z" fill="#F5F1E6" stroke="#9FBFAE" stroke-width="1.6"/>
      <path d="M-26 -30l8 -12h36l8 12" fill="#EAF5EE" stroke="#9FBFAE" stroke-width="1.6"/>
      <path d="M-18 6h36" stroke="#B99A72" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="52" font-size="12" font-weight="700" text-anchor="middle">한 봉지로</text>
      <text x="0" y="68" font-size="11" fill="#5F7166" text-anchor="middle">섞어 제출</text>
    </g>

    <text x="384" y="215" font-size="9" fill="#9FBFAE" text-anchor="end">관찰 지점 도해</text>
  </g>
</svg>
