<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>상태 표시 사전 — 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  /* 이 페이지 전용 — 앱 화면과 무관한 검수용 */
  #app { max-width: 1100px; }
  .pv-wrap { padding: 26px 22px 60px; }
  /* 도감: 상태 1줄 = 작물 5종 나열 */
  .pv-dex-row { margin-bottom: 22px; }
  .pv-dex-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px 2px; }
  .pv-dex-head .pv-dex-label { font-size: 16.5px; }
  .pv-dex-head .pv-dex-cond { font-size: 12px; color: var(--ink-soft); }
  .pv-dex-scenes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .pv-dex-cell { text-align: center; }
  .pv-dex-cell svg { width: 100%; height: auto; display: block; }
  .pv-dex-cell .pv-dex-crop { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  @media (max-width: 720px) { .pv-dex-scenes { grid-template-columns: repeat(2, 1fr); } }
  .pv-title { font-size: 21px; font-weight: 400; }
  .pv-sub { font-size: 13px; color: var(--ink-soft); margin: 4px 0 20px; }
  .pv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
  .pv-cell {
    background: var(--card); border-radius: 16px; padding: 14px 10px 12px;
    box-shadow: inset 0 0 0 1.5px var(--line-soft), var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  }
  .pv-cell .pv-label { font-size: 15px; }
  .pv-cell .pv-cond { font-size: 11.5px; color: var(--ink-soft); }
  .pv-sev { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .pv-sev.good { background: var(--green-pale); color: var(--green-deep); }
  .pv-sev.warn { background: #f6ecdb; color: #a8672f; }
  .pv-sev.danger { background: #f5e2d9; color: #b04a35; }
  .pv-head { text-align: center; font-size: 26px; letter-spacing: 0.1em; margin: 6px 0 2px; }
  .pv-headsub { text-align: center; font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  .pv-badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .pv-crops { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .pv-crop-btn {
    font: inherit; font-size: 13.5px; border: none; cursor: pointer;
    padding: 8px 16px; border-radius: 999px; color: var(--ink-soft);
    background: var(--paper-2); box-shadow: inset 0 0 0 1.5px var(--line-soft);
  }
  .pv-crop-btn.active { color: var(--green-deep); background: var(--green-pale); box-shadow: inset 0 0 0 1.5px var(--green-soft); }
  .pv-stages { margin-top: -4px; }
  .pv-stage-btn { font-size: 12px; padding: 6px 12px; }
  .pv-stage-btn.active { color: #a8672f; background: #f6ecdb; box-shadow: inset 0 0 0 1.5px #e0c49e; }
  .pv-scenes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
  .pv-scene { text-align: center; }
  .pv-scene svg { width: 100%; height: auto; display: block; }
  .pv-scene .pv-scene-title { font-size: 14.5px; letter-spacing: 0.06em; margin-top: 4px; }
  .pv-scene .pv-scene-title .sev-good { color: var(--green-deep); }
  .pv-scene .pv-scene-title .sev-warn { color: #a8672f; }
  .pv-scene .pv-scene-title .sev-danger { color: #b04a35; }
</style>
</head>
<body>
<div id="app"><div class="pv-wrap">
  <p class="eyebrow">CONDITIONS.JS 미리보기</p>
  <h1 class="pv-title">상태 표시 사전</h1>
  <p class="pv-sub">데이터 조건 → 「등급 · 표시 문구」. 아직 대시보드에는 연결되지 않은 로직입니다.</p>

  <h3 class="section-label">작물별 장면 (conditionScene) — 상태 도감 · 작물 5종 한눈에</h3>
  <div id="pv-dex"></div>

  <h3 class="section-label">헤드라인 조합 예시 (fieldHeadline)</h3>
  <div id="pv-headlines"></div>

  <h3 class="section-label">날씨 원인</h3>
  <div class="pv-grid" id="pv-weather"></div>

  <h3 class="section-label">땅·토양 원인</h3>
  <div class="pv-grid" id="pv-soil"></div>

  <h3 class="section-label">배지 형태 (conditionBadge)</h3>
  <div class="pv-badges" id="pv-badges"></div>
</div></div>

<script type="module">
import { CONDITIONS, conditionIcon, conditionBadge, fieldHeadline } from './conditions.js';
import { conditionScene } from './app.js';

// ── 상태 도감: 버튼 전환 없이 19가지 상태 × 작물 5종을 전부 나열 ──
const CROPS = [
  ['cucumber', '오이'], ['apple', '사과'], ['pear', '배'], ['potato', '감자'], ['lettuce', '상추'],
];
const SEV = { good: '양호', warn: '주의', danger: '위험' };

document.querySelector('#pv-dex').innerHTML = Object.entries(CONDITIONS).map(([code, c]) => `
  <div class="pv-dex-row">
    <div class="pv-dex-head">
      <span class="pv-sev ${c.severity}">${SEV[c.severity]}</span>
      <span class="pv-dex-label">${c.label}</span>
      <span class="pv-dex-cond">${c.condition}</span>
    </div>
    <div class="pv-dex-scenes">
      ${CROPS.map(([id, name]) => `
        <div class="pv-dex-cell">
          ${conditionScene(id, 'mature', code)}
          <div class="pv-dex-crop">${name}</div>
        </div>`).join('')}
    </div>
  </div>`).join('');

const weather = Object.entries(CONDITIONS).filter(([, c]) => c.group === 'weather');
const soil = Object.entries(CONDITIONS).filter(([, c]) => c.group === 'soil');

function cell([code, c]) {
  return `<div class="pv-cell">
    ${conditionIcon(code, 52)}
    <div class="pv-label">${c.label}</div>
    <span class="pv-sev ${c.severity}">${{ good: '양호', warn: '주의', danger: '위험' }[c.severity]}</span>
    <div class="pv-cond">${c.condition}</div>
  </div>`;
}
document.querySelector('#pv-weather').innerHTML = weather.map(cell).join('');
document.querySelector('#pv-soil').innerHTML = soil.map(cell).join('');
document.querySelector('#pv-badges').innerHTML =
  Object.keys(CONDITIONS).map((code) => conditionBadge(code)).join('');

// 샘플 데이터로 헤드라인 3종 시연
const samples = [
  { w: { tMax: 24, tMin: 15, rainMm: 0 },            s: { moisture: 45, ph: 6.5 },   note: '맑고 적정 · 토양 적정' },
  { w: { tMax: 27, tMin: 18, rainMm: 12 },           s: { moisture: 85 },            note: '비 예보 · 수분 과다' },
  { w: { tMax: 35, tMin: 26, rainMm: 0, dryDays: 5 }, s: { moisture: 15 },           note: '심각한 고온 · 수분 부족' },
];
document.querySelector('#pv-headlines').innerHTML = samples.map(({ w, s, note }) => {
  const h = fieldHeadline(w, s);
  return `<div class="pv-head">${h.title}</div>
    <p class="pv-headsub">${note} → 날씨 「${h.weather.label}」 + 토양 「${h.soil.label}」 중 심한 쪽</p>`;
}).join('');
</script>
</body>
</html>
