<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>청년농부 — 오늘의 밭</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ── 로그인 (이메일 인증코드) ───────────────── -->
  <section id="view-login" class="view" hidden>
    <div class="login-wrap">
      <h1 class="wiz-title">이메일로 로그인</h1>
      <p class="wiz-sub">이메일로 받은 인증코드를 입력하면 로그인돼요.</p>
      <div id="login-body"></div>
    </div>
  </section>

  <!-- ── 시작 마법사 (질문식 온보딩) ───────────── -->
  <section id="view-wizard" class="view" hidden>
    <div class="wizard-head">
      <button class="link-btn" id="wiz-back" hidden>‹ 이전</button>
    </div>
    <div id="wizard-body"></div>
  </section>

  <!-- ── 대시보드 ─────────────────────────────── -->
  <section id="view-home" class="view" hidden>
    <header class="home-head">
      <div>
        <p class="home-greet" id="home-greet"></p>
        <p class="home-date" id="home-date"></p>
      </div>
      <div class="home-right">
        <div class="crop-badges" id="crop-badges"></div>
      </div>
    </header>

    <div class="stage-card" id="stage-card"></div>

    <!-- 미니 상점 아이콘 (테두리 꾸미기) -->
    <div class="shop-dock" id="shop-dock"></div>

    <div class="vignette-wrap">
      <div class="vignette" id="vignette"></div>
    </div>

    <div class="status-block">
      <h2 class="status-title" id="status-title"></h2>
      <p class="status-sub" id="status-sub"></p>
    </div>

    <div class="home-actions">
      <button id="checkin-btn" class="btn btn-primary btn-wide"></button>
    </div>
  </section>

  <!-- ── 할 일 ────────────────────────────────── -->
  <section id="view-todos" class="view" hidden>
    <header class="page-head">
      <h1>TO-DO</h1>
      <p>밭일도 마음일도, 가볍게 적어둬요.</p>
    </header>
    <form id="todo-form" class="todo-form">
      <input id="todo-input" type="text" maxlength="60" placeholder="오늘 할 일을 적어보세요" autocomplete="off" />
      <button type="submit" class="todo-add" aria-label="할 일 추가">+</button>
    </form>
    <p class="todo-summary" id="todo-summary"></p>
    <div class="todo-list" id="todo-list"></div>
    <div class="suggest-row" id="todo-suggest"></div>
  </section>

  <!-- ── 교환소 (대시보드 포인트/설정에서 진입) ── -->
  <section id="view-rewards" class="view" hidden>
    <header class="page-head">
      <button class="link-btn" id="rewards-back">‹ 대시보드로</button>
      <h1>교환소</h1>
      <p>모은 포인트로 진짜 비료를 신청할 수 있어요.</p>
    </header>
    <div class="point-board" id="point-board"></div>
    <div class="reward-list" id="reward-list"></div>
    <h3 class="section-label">신청 내역</h3>
    <div class="order-list" id="order-list"></div>
  </section>

  <!-- ── 흙톡 (재배 지식 챗봇) ─────────────────── -->
  <section id="view-chat" class="view" hidden>
    <header class="page-head">
      <h1>흙톡</h1>
      <p>작물 키우기, 궁금한 건 뭐든 물어보세요.</p>
    </header>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-chips" id="chat-chips"></div>
    <form class="chat-form" id="chat-form">
      <input id="chat-input" type="text" maxlength="100" placeholder="예: 오이 물은 얼마나 줘요?" autocomplete="off" />
      <button type="submit" class="addr-find">전송</button>
    </form>
  </section>

  <!-- ── 기록 ─────────────────────────────────── -->
  <section id="view-records" class="view" hidden>
    <header class="page-head">
      <h1>기록</h1>
      <p>지금까지 밭을 돌본 발자국이에요.</p>
    </header>
    <div class="stat-row" id="stat-row"></div>
    <div class="calendar-card">
      <p class="calendar-title" id="calendar-title"></p>
      <div class="calendar" id="calendar"></div>
    </div>
    <h3 class="section-label">다이어리</h3>
    <div class="diary-write">
      <input id="diary-title" type="text" maxlength="40" placeholder="제목 (예: 첫 새싹을 봤다)" autocomplete="off" />
      <textarea id="diary-text" maxlength="300" rows="3" placeholder="오늘 밭에서, 그리고 하루에서 있었던 일을 남겨보세요."></textarea>
      <!-- 붙인 사진 미리보기 -->
      <div class="photo-slot" id="photo-slot"></div>
      <div class="photo-row" id="photo-row"></div>
      <div class="diary-actions">
        <span class="diary-hint" id="diary-hint"></span>
        <button class="btn btn-primary diary-save" id="diary-save">오늘 기록 남기기</button>
      </div>
      <!-- 카메라 촬영 / 보관함 선택 (숨은 파일 입력) -->
      <input type="file" id="photo-camera-input" accept="image/*" capture="environment" hidden />
      <input type="file" id="photo-pick-input" accept="image/*" multiple hidden />
    </div>
    <div class="diary-list" id="diary-list"></div>
    <h3 class="section-label">다 키운 작물</h3>
    <div class="harvest-list" id="harvest-list"></div>
  </section>

  <!-- ── 설정 ─────────────────────────────────── -->
  <section id="view-settings" class="view" hidden>
    <header class="page-head">
      <h1>마이페이지</h1>
      <p>내 정보와 밭 꾸미기를 관리해요.</p>
    </header>
    <div class="settings-card" id="settings-profile"></div>
    <div class="settings-card settings-note">
      <p><strong>청년농부</strong>는 매일 출석으로 작물 캐릭터를 키우고,<br/>
      모은 포인트로 밭 테두리를 꾸미거나 실물 비료로 교환하는 서비스 프로토타입이에요.</p>
    </div>
  </section>

  <!-- ── 하단 탭 ──────────────────────────────── -->
  <nav class="tabbar" id="tabbar" hidden>
    <button class="tab" data-view="home"></button>
    <button class="tab" data-view="todos"></button>
    <button class="tab" data-view="chat"></button>
    <button class="tab" data-view="records"></button>
    <button class="tab" data-view="settings"></button>
  </nav>
</div>

<!-- 새 씨앗 선택 오버레이 (수확 후) -->
<div id="overlay" class="overlay" hidden>
  <div class="overlay-panel" id="overlay-panel"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
